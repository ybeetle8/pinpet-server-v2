[server]
host = "0.0.0.0"
port = 3000


[database]
rocksdb_path = "./data/event"
# OrderBook 专用数据库路径 / OrderBook dedicated database path
orderbook_db_path = "./data/orderbook"
# 统计数据库路径 / Statistics database path
stats_db_path = "./data/stats"
# OrderBook查询最大返回数量(默认60000) / OrderBook query max limit (default 60000)
orderbook_max_limit = 60000

# OrderBook 数据库性能配置 (可选) / OrderBook database performance config (optional)
[database.orderbook_db]
# 单个写缓冲区大小(MB) / Single write buffer size (MB)
write_buffer_size_mb = 1048
# 最大写缓冲区数量 / Max number of write buffers
max_write_buffer_number = 4
# 是否启用 fsync (生产环境建议 true) / Enable fsync (recommend true for production)
use_fsync = false
# 是否启用偏执检查 / Enable paranoid checks
paranoid_checks = false
# 最大后台任务数 / Max background jobs 
max_background_jobs = 32

[solana]
# Solana节点配置 / Solana node configuration
# 用于获取链上价格的 RPC URL / RPC URL for fetching on-chain price
rpc_price_url = "https://mainnet.helius-rpc.com/?api-key=7919f9f6-a6e8-4597-baf2-601f64ec9e5e"
#rpc_url = "http://162.250.124.66:8899"
#ws_url = "ws://162.250.124.66:8900"
rpc_url = "http://192.168.18.5:8899"
ws_url = "ws://192.168.18.5:8900"
ws_url2 = "ws://47.109.157.92:8900"
# 请替换为实际的Pinpet程序ID / Please replace with the actual Pinpet program ID
program_id = "F2FzigE1Z374iDvreiM6hZQe6oGXgomJfv8PyybvUXye"
# 事件监听器配置 / Event listener configuration
enable_event_listener = true
commitment = "processed"  # processed/confirmed/finalized
reconnect_interval = 5  # 重连间隔(秒) - 现在固定为5秒 / Reconnect interval in seconds - now fixed at 5 seconds
max_reconnect_attempts = 0  # 不再使用，现在是永久循环 / No longer used, now loops forever
# 事件处理配置 / Event processing configuration
event_buffer_size = 50000
event_batch_size = 50
# WebSocket ping间隔(秒) / WebSocket ping interval in seconds
ping_interval_seconds = 15
# 是否处理失败的交易(开发/测试用) / Whether to process failed transactions (dev/test)
process_failed_transactions = false
# 是否记录原始Solana消息到单独文件用于调试 / Log raw Solana messages for debugging
enable_raw_message_logging = true

[ipfs]
# IPFS网关配置 / IPFS gateway configuration
gateway_url = "https://pinpet.mypinata.cloud/ipfs/"
request_timeout_seconds = 30
max_retries = 3
retry_delay_seconds = 5

[orderbook_sync]
# 是否启用延迟对比同步 / Enable delayed comparison sync
enabled = true
# 触发对比的空闲时间阈值（秒）/ Idle threshold for triggering comparison (seconds)
idle_threshold_seconds = 30
# 检查间隔（秒）/ Check interval (seconds)
check_interval_seconds = 5
# 最大并发同步任务数 / Maximum concurrent sync tasks
max_concurrent_syncs = 3
# 是否自动修复差异 / Auto repair differences
auto_repair = true
# 同步失败重试次数 / Retry count on sync failure
retry_count = 3
# 重试延迟（秒）/ Retry delay (seconds)
retry_delay_seconds = 5
